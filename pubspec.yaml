name: medstory
description: AI-powered study app for medical students - summaries, FSRS flashcards, story mnemonics, and last-day revision.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  flutter_riverpod: ^2.6.1

  # FSRS spaced repetition
  fsrs: ^2.0.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  http: ^1.2.2

  # File picking (for later PDF)
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
